# Runs the automatic tests on every push and pull request.
# Unit and browser tests need Node and Chromium; database tests run the setup
# files on a fresh PostgreSQL database.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Browser tests
        run: npm run test:browser

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Database tests
        run: npm run test:sql
      - name: avilonx-update.sql is up to date
        run: git diff --exit-code -- avilonx-update.sql
